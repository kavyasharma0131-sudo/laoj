<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARAYA — Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main class="auth-shell">
    <section class="auth-card">

      <div class="brand">ARAYA</div>

      <p class="eyebrow">ACCOUNT RECOVERY</p>

      <h1>Forgot Password?</h1>

      <p class="muted">
        Enter your registered mobile number or email.
        If the account exists, ARAYA will send a verification
        code through the configured provider.
      </p>

      <form id="recoveryForm">

        <label for="recoveryId">
          Mobile Number / Email

          <input
            id="recoveryId"
            name="identifier"
            type="text"
            autocomplete="username"
            placeholder="Enter mobile or email"
            required
          >
        </label>

        <button type="submit">SEND OTP</button>

        <p id="message" class="message" aria-live="polite"></p>

      </form>

      <a class="back" href="/login.html">
        ← Back to login
      </a>

    </section>
  </main>

  <script>
    document
      .getElementById("recoveryForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        const message = document.getElementById("message");
        const identifier =
          document.getElementById("recoveryId").value.trim();

        message.textContent = "Sending request...";

        try {

          const response = await fetch(
            "/api/auth/forgot-password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                identifier: identifier
              })
            }
          );

          const data = await response.json();

          message.textContent =
            data.message ||
            "If the account exists, a verification code will be sent.";

        } catch (error) {

          message.textContent =
            "Unable to contact the ARAYA server.";

        }

      });
  </script>

</body>
</html>
